<style>
:root {

*,*::before,*::after{ box-sizing:border-box; }

body{

.container{

  margin-right:auto;
  position: relative;
  z-index: 2;

/* 🖍️ 標題配置 (美式漫畫字體感) */
h1 { 
  text-align: center; 
  margin: 10px 0 30px; 
  font-size: 21px; 
  font-weight: 900;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px; 
  color: #FFFFFF;
  /* 漫畫風厚重黑色文字陰影 */
  text-shadow: 2px 2px 0 var(--primary-dark), -2px -2px 0 var(--primary-dark), 2px -2px 0 var(--primary-dark), -2px 2px 0 var(--primary-dark), 4px 4px 0 rgba(0,0,0,0.5);
  letter-spacing: 1px;
  flex-wrap: nowrap; 
  white-space: nowrap;
}

/* 左側裝飾：花花或泡泡 (支援 png/gif) */
h1::before {
  content: "";
  display: block;
  width: 60px; 
  height: 60px;
  background: url("ppg_left.gif") no-repeat center;
  background-size: contain;
  flex-shrink: 0;
  filter: drop-shadow(2px 2px 0px #000) drop-shadow(0 4px 6px rgba(0,0,0,0.5));
}

/* 右側裝飾：毛毛或尤教授 (支援 png/gif) */
h1::after {
  content: "";
  display: block;
  width: 60px; 
  height: 60px;
  background: url("ppg_right.gif") no-repeat center;
  background-size: contain;
  flex-shrink: 0;
  filter: drop-shadow(2px 2px 0px #000) drop-shadow(0 4px 6px rgba(0,0,0,0.5));
}

.subtitle{ text-align:center; font-size:14px; color: #FFFFFF; margin-bottom:8px; font-weight: 900; letter-spacing: 1px; text-shadow: 1px 1px 0 #000;}

/* 🔹 分頁標籤 (對話框風格) */
.tab-header{
  display:flex;
  gap:10px;
  margin-bottom:60px;    
  position: relative;     
  z-index: 1;             
}

.tab-header button{
  flex:1;
  padding:12px 0;
  border-radius:12px;
  border:3px solid var(--primary-dark);
  background: #FFFFFF;
  font-size:15px;
  font-weight: 900;
  color: var(--primary-dark);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.17, 0.67, 0.83, 0.67);
  box-shadow: 4px 4px 0px var(--primary-dark);
  letter-spacing: 1px;
}

.tab-header button:active {
  transform: translate(4px, 4px);
  box-shadow: 0px 0px 0px var(--primary-dark);
}

.tab-header button.active {
  background: var(--accent-yellow) !important; /* 點擊後變亮黃色 */
  color: var(--primary-dark) !important;
}

.section{
  background: var(--card-bg);
  border-radius:16px;
  border:4px solid var(--primary-dark);
  padding:20px 16px;
  margin-bottom:15px;
  position:relative;
  overflow: visible !important;

  box-shadow: 6px 6px 0px var(--primary-dark);

/* 左側裝飾：化學物 X 或是其他小物件 (png/gif) */
.section::before {
  content: "";
  position: absolute;
  top: -62px; 
  left: 20%;
  transform: rotate(0deg);
  width: 60px; 
  height: 60px;
  background: url("chem_x_deco.gif") no-repeat center;

  z-index: 10;

  filter: drop-shadow(2px 2px 0px #000);
}

/* 右上方大裝飾：魔人啾啾或是愛心大背板 (png/gif) */

  content: ""; 
  position: absolute; 
  z-index: 10;            
  top: -116px;    
  left: 65%;
  transform: translateX(-50%);
  width: 170px;   
  height: 170px; 
  background: url("mojo_deco.gif") no-repeat center;
  background-size: contain;

label{ display:block;font-size:14px;margin-top:4px; color: #000; font-weight: 900; }

/* =============== 💖 飛天小女警動態特效 =============== */
.powerpuff-effects span {
  position:fixed; 
  top:-50px;
  display:block;
  font-size: 24px;
  animation: fallDown linear infinite;
  opacity: 0;
  z-index: 0;
  pointer-events: none;
  filter: drop-shadow(2px 2px 0px #000); /* 給飄落物加上漫畫黑邊 */
}

.powerpuff-effects span:nth-child(1) { left: 8%;  animation-delay: 0s;   animation-duration: 12s; }
.powerpuff-effects span:nth-child(2) { left: 20%; animation-delay: 4s;   animation-duration: 16s; font-size: 28px;}
.powerpuff-effects span:nth-child(3) { left: 40%; animation-delay: 1.5s; animation-duration: 14s; }
.powerpuff-effects span:nth-child(4) { left: 60%; animation-delay: 7s;   animation-duration: 18s; font-size: 20px;}
.powerpuff-effects span:nth-child(5) { left: 75%; animation-delay: 0.5s; animation-duration: 11s; }
.powerpuff-effects span:nth-child(6) { left: 90%; animation-delay: 5s;   animation-duration: 15s; font-size: 30px;}
.powerpuff-effects span:nth-child(7) { left: 50%; animation-delay: 9s;   animation-duration: 13s; }

@keyframes fallDown {
  0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
  10%  { opacity: 0.9; }
  80%  { opacity: 0.9; }
  100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}

.hidden { display: none !important; }

function getCurrentDateStr() {
    const input = document.getElementById("date");
    let value = input && input.value;
    if (!value) {
        const d = new Date();
        const m = ("0" + (d.getMonth() + 1)).slice(-2);
        const day = ("0" + d.getDate()).slice(-2);
        value = `${d.getFullYear()}-${m}-${day}`;
        if (input) input.value = value;
    }
    return value;
}

function addDaysToDateStr(dateStr, delta) {
    const [y, m, d] = String(dateStr).split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    dt.setDate(dt.getDate() + delta);
    const mm = ("0" + (dt.getMonth() + 1)).slice(-2);
    const dd = ("0" + dt.getDate()).slice(-2);
    return `${dt.getFullYear()}-${mm}-${dd}`;
}

function storageKey(dateStr) { return `${STORAGE_PREFIX}${dateStr}`; }
function $(id) { return document.getElementById(id); }
function v(id) { const el = $(id); return String(el ? (el.value ?? "") : "").trim(); }
function num(val) {
    const s = String(val ?? "").trim();
    if (s === "") return 0;
    const x = Number(s);
    return Number.isFinite(x) ? x : 0;
}

function hasDataOnDate(dateStr) { return localStorage.getItem(storageKey(dateStr)) != null; }
function loadByDate(dateStr) {
    const raw = localStorage.getItem(storageKey(dateStr));
    if (!raw) return null;
    try { return JSON.parse(raw); } catch { return null; }
}

function findPrevDateWithData(fromDateStr, maxLookbackDays = 60) {
    let cursor = addDaysToDateStr(fromDateStr, -1);
    for (let i = 0; i < maxLookbackDays; i++) {
        if (hasDataOnDate(cursor)) return cursor;
        cursor = addDaysToDateStr(cursor, -1);
    }
    return null;
}

        'huddle': $('tab-huddle'), 
        'plan': $('tab-plan'), 
        'history': $('tab-history') 
    };

    Object.keys(views).forEach(key => {
        if (views[key]) {
            views[key].classList.toggle("hidden", key !== view);
        }
        if (tabs[key]) {
            tabs[key].classList.toggle("active", key === view);
        }
    });

    if (view === "huddle") {
        try { fetchAndRenderProgress(); } catch(e) { console.error(e); }
    } else if (view === "history") {
        try { renderStarryMap(); } catch(e) { console.error(e); }
    }
}

// ===== 討伐計畫渲染 (漫畫風設計) =====
function initPlanTab() {
    const selectName = $("plan-name-select");
    const selectCustomer = $("filter-customer");
    const selectItem = $("filter-item");
    const container = $("plan-list-container");

    if (!selectName || !container) return;

    selectName.innerHTML = '<option value="">-- 小鎮村全體守護者 --</option>';
    Object.keys(monthlyData).forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        selectName.appendChild(opt);
    });

    const renderPlans = () => {
        const selectedName = selectName.value;
        const filterCust = selectCustomer.value;
        const filterItem = selectItem.value;

        container.innerHTML = "";
        let tasksToFilter = [];
        
        if (selectedName === "") {
            Object.entries(monthlyData).forEach(([name, tasks]) => {
                tasks.forEach(task => {
                    if (task.content.trim() !== "" || task.target.trim() !== "") {
                        tasksToFilter.push({ ...task, staffName: name });
                    }
                });
            });
        } else {
            const individualTasks = monthlyData[selectedName] || [];
            tasksToFilter = individualTasks.map(task => ({ ...task, staffName: selectedName }));
        }

        const filteredData = tasksToFilter.filter(plan => {
            const matchCust = (filterCust === "all" || plan.customerType === filterCust);
            const matchItem = (filterItem === "all" || plan.itemType === filterItem);
            return matchCust && matchItem;
        });

        if (filteredData.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#FFF; text-shadow: 1px 1px 0 #000; font-size:15px; margin-top:20px; font-weight:900;">目前小鎮村非常和平！</p>';
            return;
        }

        filteredData.forEach((plan, index) => {
            const planEl = document.createElement("div");
            // 漫畫框卡片
            planEl.style.cssText = "background: #fff; border: 3px solid var(--primary-dark); border-radius: 12px; padding: 18px; margin-bottom: 20px; box-shadow: 4px 4px 0px var(--primary-dark); position:relative;";
            
            // 標籤顏色：花花(粉)、泡泡(藍)、毛毛(綠)
            const custColor = plan.customerType === '潛客' ? 'var(--buttercup-green)' : (plan.customerType === '新客' ? 'var(--bubbles-blue)' : 'var(--primary)'); 
            const itemColor = plan.itemType === 'RS' ? 'var(--buttercup-green)' : (plan.itemType === '保健' ? 'var(--accent-yellow)' : 'var(--bubbles-blue)');

            const custAbbr = plan.customerType ? plan.customerType.substring(0, 1) : '?';
            const itemAbbr = plan.itemType ? plan.itemType.substring(0, 1) : '?';
            const tagCircleStyle = "display:inline-flex; justify-content:center; align-items:center; width:28px; height:28px; border-radius:50%; color:#FFF; font-size:14px; font-weight:900; box-sizing:border-box; border:2px solid var(--primary-dark); text-shadow: 1px 1px 0 #000;";

            planEl.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px; border-bottom: 3px solid var(--primary-dark); padding-bottom: 10px;">
                    <div>
                        <div style="font-weight: 900; color: var(--primary-dark); font-size: 19px; letter-spacing:1px;">${plan.staffName}</div>
                        <div style="font-size: 12px; color: #555; margin-top: 4px; font-weight:900;">緊急任務 #${index + 1}</div>
                    </div>
                    <div style="display:flex; gap: 8px; align-items:center;">
                        <span style="${tagCircleStyle} background:${custColor};" title="${plan.customerType || '未分類'}">${custAbbr}</span>
                        <span style="${tagCircleStyle} background:${itemColor};" title="${plan.itemType || '未分類'}">${itemAbbr}</span>
                    </div>
                </div>
                
                <div style="margin-bottom: 16px;">
                    <div style="font-weight: 900; color: var(--primary); font-size: 14px; margin-bottom: 6px; letter-spacing:1px; text-shadow:1px 1px 0 rgba(0,0,0,0.1);">巡邏路線</div>
                    <div style="font-size: 15px; line-height: 1.6; color: #222; text-align: justify; font-weight:700;">${plan.content}</div>
                </div>

                <div>
                    <div style="font-weight: 900; color: var(--bubbles-blue); font-size: 14px; margin-bottom: 6px; letter-spacing:1px; text-shadow:1px 1px 0 rgba(0,0,0,0.1);">打擊目標</div>
                    <div style="font-size: 15px; line-height: 1.6; color: #555; text-align: justify; font-weight:700;">${plan.target}</div>
                </div>
            `;
            container.appendChild(planEl);
        });
    };

    [selectName, selectCustomer, selectItem].forEach(el => el.addEventListener("change", renderPlans));
    renderPlans();
}

// ===== 進度條渲染 (化學物 X 能量條) =====
async function fetchAndRenderProgress() {
    const container = $("progress-dashboard");
    if (!container) return;

    try {
        const response = await fetch(PROGRESS_API_URL);
        if (!response.ok) throw new Error("網路請求失敗");
        
        const tasks = await response.json(); 
        container.innerHTML = ""; 

        if (tasks.length === 0) {
            container.innerHTML = "<p style='text-align:center; color:var(--primary-dark); font-weight:900;'>目前沒有犯罪事件發生！</p>";
            return;
        }

        const groupedTasks = tasks.reduce((acc, task) => {
            if (!acc[task.staffName]) acc[task.staffName] = [];
            acc[task.staffName].push(task);
            return acc;
        }, {});

        Object.entries(groupedTasks).forEach(([staffName, staffTasks]) => {
            const taskRowsHtml = staffTasks.map(task => {
                // 滿能量 (泡泡藍) 與 警告能量 (爆炸紅)
                const barColor = task.percent >= 80 ? "var(--bubbles-blue)" : "var(--accent-red)"; 
                return `
                    <div style="margin-bottom: 22px;">
                        <div style="display:flex; justify-content:space-between; align-items:end; margin-bottom:8px;">
                            <span style="font-size:15px; font-weight:900; color:var(--primary-dark);">${task.taskName}</span>
                            <span style="font-weight:900; color:${barColor}; font-size:15px; background:#F5F5F5; padding:2px 8px; border-radius:6px; border: 2px solid var(--primary-dark); text-shadow: 1px 1px 0px rgba(0,0,0,0.1);">${task.completed} / ${task.target}</span>
                        </div>
                        <div style="background:#FFF; height:18px; border-radius:10px; overflow:hidden; border: 3px solid var(--primary-dark); box-shadow: 2px 2px 0px var(--primary-dark);">
                            <div style="background:${barColor}; width:${task.percent}%; height:100%; transition:width 1.2s cubic-bezier(0.17, 0.67, 0.83, 0.67); border-right: 3px solid var(--primary-dark);"></div>
                        </div>
                        <div style="text-align:right; font-size:12px; color:#333; margin-top:6px; font-weight:900;">化學物 X 能量 ${task.percent}%</div>
                    </div>
                `;
            }).join("");

            const card = document.createElement("div");
            card.style.cssText = "background:#fff; padding:20px; border-radius:12px; margin-bottom:20px; border:3px solid var(--primary-dark); box-shadow: 4px 4px 0px var(--primary-dark);";
            
            card.innerHTML = `
                <div style="font-weight:900; font-size:19px; color:var(--primary-dark); margin-bottom:18px; border-bottom: 3px solid var(--primary-dark); padding-bottom:10px;">
                     ${staffName} 
                </div>
                ${taskRowsHtml}
            `;
            container.appendChild(card);
        });

    } catch (error) {
        console.error("進度抓取失敗:", error);
        container.innerHTML = `<p style="text-align:center; color:var(--primary-dark); font-size:15px; font-weight:900; background:#FFF; padding:10px; border:3px solid #000; box-shadow: 4px 4px 0 #000;">⚠️ 無法連線至尤教授實驗室</p>`;
    }
}

// ===== 歷史回顧與星圖 (愛心) =====
async function renderStarryMap() {
    const container = $("starry-map-container");
    if (!container) return;
    
    container.innerHTML = "<p style='text-align:center; color:var(--primary-dark); font-size:14px; font-weight:900; background:#FFF; padding:10px; border:3px solid #000; box-shadow: 4px 4px 0 #000; border-radius:8px;'>正在展開熱線紀錄...</p>";

    try {
        const response = await fetch(`${PROGRESS_API_URL}?action=getHistory`);
        globalHistoryData = await response.json(); 

        container.innerHTML = ""; 
        const staffNames = Object.keys(monthlyData);

        staffNames.forEach(name => {
            const card = document.createElement("div");
            card.style.cssText = "background:#fff; padding:16px; border-radius:12px; margin-bottom:15px; border:3px solid var(--primary-dark); box-shadow: 4px 4px 0px var(--primary-dark);";
            
            let starsHtml = "";
            for (let i = 1; i <= 12; i++) {
                const monthKey = `${i}月`;
                const monthPlans = globalHistoryData[name]?.[monthKey]; 
                
                let displayContent = ""; 

                if (monthPlans && monthPlans.length > 0) {
                    const isAllDone = monthPlans.every(p => p.status === "⭐" || p.status === "⭐️");
                    
                    if (isAllDone) {
                        displayContent = `<div style="font-size:26px; filter:drop-shadow(2px 2px 0px rgba(0,0,0,1)); transform: scale(1.15);">💖</div>`;
                    } else {
                        displayContent = `<div style="font-size:26px; filter:drop-shadow(2px 2px 0px rgba(0,0,0,0.5)); opacity:0.6;">💥</div>`;
                    }
                }

                starsHtml += `
                    <div onclick="openHistoryDetail('${name}', '${monthKey}')" style="text-align:center; cursor:pointer; min-height:45px; transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">
                        <div style="font-size:13px; color:var(--primary-dark); margin-bottom:4px; font-weight:900;">${i}月</div>
                        ${displayContent}
                    </div>
                `;
            }

            card.innerHTML = `
                <div style="font-weight:900; font-size: 16px; color:var(--primary-dark); margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; letter-spacing:1px;">
                    <span>${name}</span>
                </div>
                <div style="display:grid; grid-template-columns: repeat(6, 1fr); gap:10px;">
                    ${starsHtml}
                </div>
            `;
            container.appendChild(card);
        });
    } catch (error) {
        console.error("讀取星圖失敗:", error);
        container.innerHTML = "<p style='text-align:center; color:var(--accent-red); font-weight:bold; background:#FFF; padding:10px; border:3px solid #000; box-shadow: 4px 4px 0 #000;'>⚠️ 小鎮村熱線故障，請檢查通訊</p>";
    }
}

// 詳細視窗與 RCA 邏輯
window.openHistoryDetail = function(name, month) {
    const modal = $("history-modal");
    const content = $("modal-content");
    const monthPlans = globalHistoryData[name]?.[month] || [];
    
    if (modal) modal.classList.remove("hidden");

    if (monthPlans.length === 0) {
        content.innerHTML = `<h3 style="text-align:center; color:var(--primary-dark); margin:20px 0; font-weight:900;">該月沒有犯罪紀錄 🕊️</h3>`;
        return;
    }

    let plansListHtml = monthPlans.map((p, idx) => {
        const isAchieved = p.status === '⭐' || p.status === '⭐️';
        const statusEmoji = isAchieved ? "💖" : "💥";
        const statusLabel = isAchieved ? "小鎮村平安" : "犯罪發生";
        const themeColor = isAchieved ? "var(--bubbles-blue)" : "var(--accent-red)"; 
        const bgColor = isAchieved ? "#E1F5FE" : "#FFEBEE";    

        return `
            <div style="background:#fff; padding:16px; border-radius:10px; margin-bottom:15px; border:3px solid var(--primary-dark); box-shadow: 4px 4px 0px ${themeColor};">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <span style="font-size:13px; font-weight:900; color:var(--primary-dark);">檔案 #${idx + 1}</span>
                    <span style="background:${bgColor}; color:var(--primary-dark); padding:4px 12px; border-radius:8px; font-size:13px; font-weight:900; border: 2px solid var(--primary-dark);">
                        ${statusEmoji} ${statusLabel}
                    </span>
                </div>
                <div style="font-size:15px; color:#000; line-height:1.6; font-weight:900;"><strong>指令：</strong>${p.plan}</div>
                <div style="font-size:13.5px; color:#333; margin-top:8px; padding-top:8px; border-top:3px dashed var(--primary-dark); font-weight:700;"><strong>目標：</strong>${p.target}</div>
            </div>
        `;
    }).join("");

    const hasFailedTask = monthPlans.some(p => !(p.status === "⭐" || p.status === "⭐️"));
    let rcaHtml = "";
    
    if (hasFailedTask) {
        rcaHtml = `
            <div style="border-top:4px solid var(--primary-dark); margin-top:20px; padding-top:15px;">
                <h3 style="color:var(--accent-red); text-align:center; font-size:17px; margin-bottom:12px; font-weight:900; letter-spacing:1px; text-shadow:1px 1px 0 #000;">💥 任務失敗原因分析</h3>
                <select id="rca-reason" style="width:100%; padding:14px; border-radius:8px; border:3px solid var(--primary-dark); font-size:15px; background:#FFF; color:#000; font-weight:900; box-shadow: inset 2px 2px 0 rgba(0,0,0,0.1);">
                    <option value="外部突發">🐒 遇到魔人啾啾搗亂 (外部突發狀況)</option>
                    <option value="能力加強">🧪 化學物 X 不足 (名單漏追/能力待加強)</option>
                    <option value="時間管理">📞 市長一直打電話 (時間管理/頻繁被打斷)</option>
                    <option value="尋求支援">👨‍🔬 呼叫尤教授支援 (需要主管/同事協助)</option>
                    <option value="其他">📝 小鎮村熱線異常（面談討論）</option>
                </select>
                <button onclick="submitRCA('${name}', '${month}')" style="width:100%; background:var(--accent-red); color:white; padding:16px; border-radius:12px; margin-top:16px; border:3px solid var(--primary-dark); font-weight:900; font-size:16px; cursor:pointer; box-shadow: 4px 4px 0px var(--primary-dark); transition:transform 0.1s; letter-spacing: 1px; text-shadow: 1px 1px 0 #000;">聯絡市長回報</button>
            </div>
        `;
    }

    content.innerHTML = `
        <h3 style="color:var(--primary-dark); text-align:center; margin:0 0 20px 0; font-weight:900; font-size:22px; letter-spacing:2px; text-shadow:1px 1px 0 rgba(0,0,0,0.2);">✨ ${month} 拯救日誌 </h3>
        <div style="max-height:350px; overflow-y:auto; padding-right:5px;">${plansListHtml}</div>
        ${rcaHtml}
    `;
};

window.submitRCA = async function(name, month) {
    const reasonEl = document.getElementById("rca-reason");
    if (!reasonEl) return;
    
    const reason = reasonEl.value;
    const submitBtn = event.target; 

    submitBtn.disabled = true;
    submitBtn.innerText = "熱線傳輸中...";
    submitBtn.style.background = "#555";
    submitBtn.style.boxShadow = "0px 0px 0px var(--primary-dark)";
    submitBtn.style.transform = "translate(4px, 4px)";

    try {
        await fetch(PROGRESS_API_URL, {
            method: "POST",
            mode: "no-cors", 
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "submitRCA", name: name, month: month, reason: reason })
        });

        alert(`✔️ 回報成功！\n市長已收到「${month} / ${name}」的熱線：\n${reason}`);
        closeModal(); 
        
    } catch (e) {
        console.error("RCA 送出失敗:", e);
        alert("❌ 遭魔人啾啾攔截，請檢查網路連線");
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "聯絡市長回報";
        submitBtn.style.background = "var(--accent-red)";
        submitBtn.style.boxShadow = "4px 4px 0px var(--primary-dark)";
        submitBtn.style.transform = "none";
    }
};

window.closeModal = function() {
    if ($("history-modal")) $("history-modal").classList.add("hidden");
};

document.addEventListener("DOMContentLoaded", () => {
    if($("tab-huddle")) $("tab-huddle").addEventListener("click", () => showView("huddle"));
    if($("tab-plan")) $("tab-plan").addEventListener("click", () => showView("plan"));
    if($("tab-history")) $("tab-history").addEventListener("click", () => showView("history"));
  
    showView("huddle");
    initPlanTab();
});
</script>
