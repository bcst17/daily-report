<style>
:root {
  /* 🗡️ 鬼滅之刃 大正和風配色 */
  --bg-night: #1C1924;        /* 藤襲山暗紫夜色 */
  --primary-dark: #1A1A1A;    /* 鬼殺隊服墨黑 (主輪廓與文字) */
  --primary: #00855B;         /* 炭治郎市松紋綠 */
  --accent-red: #C82A2A;      /* 炎之呼吸 / 血鬼術紅 (警告色) */
  --border: #3A3A3A;         /* 暗灰邊框 */
  --card-bg: #FAFAFA;        /* 和紙米白 */
  --secondary: #0277BD;       /* 水之呼吸藍 (高達成率) */
  --wisteria: #8B5FBF;       /* 紫藤花紫 */
}

*,*::before,*::after{ box-sizing:border-box; }

body{
  font-family:-apple-system,BlinkMacSystemFont,"Microsoft JhengHei",system-ui,sans-serif;
  margin:0;
  /* 💡 修改這裡：將左右 padding 從 14px 加大到 28px，為凸出去的圖片留出「邊緣安全區」 */
  padding:20px 28px 90px;
  /* 🗡️ 炭治郎市松紋 (綠黑格子) 背景 */
  background-color: #1A1A1A;
  background-image:

    linear-gradient(45deg, #00855B 25%, transparent 25%, transparent 75%, #00855B 75%, #00855B);
  background-size: 80px 80px;
  background-position: 0 0, 40px 40px;
  
  display:flex;
  justify-content:center;
  color:#333;
  overflow-x:hidden;
}

.container{
  width:100%;
  max-width:520px;
  margin-left:auto;
  margin-right:auto;
  position: relative;
  z-index: 2;
}

/* 🖍️ 標題配置 (大正熱血風) */
h1 { 
  text-align: center; 
  margin: 10px 0 30px; 
  font-size: 24px; /* 💡 稍微縮小字體以適應較窄的手機 */
  font-weight: 900;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px; 
  color: #FFFFFF;
  text-shadow: 0 0 10px rgba(0, 133, 91, 0.8), 0 2px 4px rgba(0,0,0,1);
  letter-spacing: 1px;
  flex-wrap: wrap; /* 💡 允許在極小螢幕自動彈性換行，避免擠壓 */
}

/* 預留給自行上傳的左側圖示：建議放 炭治郎/炎柱 (支援 png/gif) */
h1::before {
  content: "";
  display: block;
  width: 60px; /* 💡 尺寸從 70px 微調為 60px，防擠壓 */
  height: 60px;
  background: url("tanjiro_left.png") no-repeat center;
  background-size: contain;
  flex-shrink: 0;
  filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
}

/* 預留給自行上傳的右側圖示：建議放 禰豆子/其他柱 (支援 png/gif) */
h1::after {
  content: "";
  display: block;
  width: 60px; /* 💡 尺寸從 70px 微調為 60px，防擠壓 */
  height: 60px;
  background: url("nezuko_right.png") no-repeat center;
  background-size: contain;
  flex-shrink: 0;
  filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
}

.subtitle{ text-align:center; font-size:14px; color: var(--wisteria); margin-bottom:8px; font-weight: bold; letter-spacing: 1px;}

/* 🔹 分頁標籤 (鬼殺隊名牌風) */
.tab-header{
  display:flex;
  gap:8px;
  margin-bottom:60px;    
  position: relative;     
  z-index: 1;             
}

.tab-header button{
  flex:1;
  padding:12px 0;
  border-radius:8px;
  border:2px solid var(--primary-dark);
  background: rgba(250, 250, 250, 0.9);
  font-size:15px;
  font-weight: 900;
  color: var(--primary-dark);
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 0px var(--primary-dark);
  letter-spacing: 1px;
}

.tab-header button:active {
  transform: translateY(4px);
  box-shadow: 0 0px 0px var(--primary-dark);
}

.tab-header button.active {
  background: var(--primary-dark) !important;
  color: #FFFFFF !important;
  border-color: var(--primary-dark);
  box-shadow: 0 4px 0px rgba(0,0,0,0.8);
}

.section{
  background: var(--card-bg);
  border-radius:12px;
  border:4px solid var(--primary-dark);
  padding:20px 16px;
  margin-bottom:12px;
  position:relative;
  overflow: visible !important; 
  box-shadow: 0 10px 20px rgba(0,0,0,0.4);
}

/* 左側裝飾：預留給自行上傳的圖示 (如：日輪刀或刀鍔 png/gif) */
.section::before {
  content: "";
  position: absolute;
  top: -50px; 
  left: -20px;
  transform: rotate(-15deg);
  width: 85px; 
  height: 85px;
  background: url("sword_deco.png") no-repeat center;
  background-size: contain;
  z-index: 10;            
  pointer-events: none;
  filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.3));
}

/* 右側裝飾：預留給自行上傳的圖示 (如：狐狸面具或紫藤花 png/gif) */
.section::after {
  content: ""; 
  position: absolute; 
  z-index: 10;            
  top: -40px;    
  right: -15px;    
  transform: rotate(20deg);
  width: 75px;   
  height: 75px; 
  background: url("mask_deco.png") no-repeat center;
  background-size: contain;
  pointer-events: none;   
  filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.3));
}

.section h2{ margin:0 0 15px; font-size:19px; font-weight:900; color: var(--primary-dark); border-left: 6px solid var(--primary); padding-left: 10px; letter-spacing: 1px;}

label{ display:block;font-size:14px;margin-top:4px; color: #555; font-weight: bold; }

input,select{
  width:100%;
  padding:12px; font-size:15px; font-weight:bold; color:var(--primary-dark);

input:focus, select:focus{

/* =============== 🌸 Action Animation (紫藤花與呼吸法特效) =============== */
.breathing-effects span {
  position:fixed; 
  top:-50px;
  display:block;
  font-size: 24px;
  animation: fallDown linear infinite;
  opacity: 0;
  z-index: 0;
  pointer-events: none;
  filter: drop-shadow(0 0 5px rgba(255,255,255,0.4));
}

.breathing-effects span:nth-child(1) { left: 8%;  animation-delay: 0s;   animation-duration: 12s; }
.breathing-effects span:nth-child(2) { left: 20%; animation-delay: 4s;   animation-duration: 16s; font-size: 28px;}
.breathing-effects span:nth-child(3) { left: 40%; animation-delay: 1.5s; animation-duration: 14s; }
.breathing-effects span:nth-child(4) { left: 60%; animation-delay: 7s;   animation-duration: 18s; font-size: 20px;}
.breathing-effects span:nth-child(5) { left: 75%; animation-delay: 0.5s; animation-duration: 11s; }
.breathing-effects span:nth-child(6) { left: 90%; animation-delay: 5s;   animation-duration: 15s; font-size: 30px;}
.breathing-effects span:nth-child(7) { left: 50%; animation-delay: 9s;   animation-duration: 13s; }

@keyframes fallDown {
  0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
  10%  { opacity: 0.8; }
  80%  { opacity: 0.8; }
  100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}

.hidden { display: none !important; }

function getCurrentDateStr() {
    const input = document.getElementById("date");
    let value = input && input.value;
    if (!value) {
        const d = new Date();
        const m = ("0" + (d.getMonth() + 1)).slice(-2);
        const day = ("0" + d.getDate()).slice(-2);
        value = `${d.getFullYear()}-${m}-${day}`;
        if (input) input.value = value;
    }
    return value;
}

function addDaysToDateStr(dateStr, delta) {
    const [y, m, d] = String(dateStr).split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    dt.setDate(dt.getDate() + delta);
    const mm = ("0" + (dt.getMonth() + 1)).slice(-2);
    const dd = ("0" + dt.getDate()).slice(-2);
    return `${dt.getFullYear()}-${mm}-${dd}`;
}

function storageKey(dateStr) { return `${STORAGE_PREFIX}${dateStr}`; }
function $(id) { return document.getElementById(id); }
function v(id) { const el = $(id); return String(el ? (el.value ?? "") : "").trim(); }
function num(val) {
    const s = String(val ?? "").trim();
    if (s === "") return 0;
    const x = Number(s);
    return Number.isFinite(x) ? x : 0;
}

function hasDataOnDate(dateStr) { return localStorage.getItem(storageKey(dateStr)) != null; }
function loadByDate(dateStr) {
    const raw = localStorage.getItem(storageKey(dateStr));
    if (!raw) return null;
    try { return JSON.parse(raw); } catch { return null; }
}

function findPrevDateWithData(fromDateStr, maxLookbackDays = 60) {
    let cursor = addDaysToDateStr(fromDateStr, -1);
    for (let i = 0; i < maxLookbackDays; i++) {
        if (hasDataOnDate(cursor)) return cursor;
        cursor = addDaysToDateStr(cursor, -1);
    }
    return null;
}

function showView(view) {
    const views = { 
        'huddle': $('huddle-view'), 
        'plan': $('plan-view'), 
        'history': $('history-view') 
    };
    
    const tabs = { 
        'huddle': $('tab-huddle'), 
        'plan': $('tab-plan'), 
        'history': $('tab-history') 
    };

    Object.keys(views).forEach(key => {
        if (views[key]) {
            views[key].classList.toggle("hidden", key !== view);
        }
        if (tabs[key]) {
            tabs[key].classList.toggle("active", key === view);
        }
    });

    if (view === "huddle") {
        try { fetchAndRenderProgress(); } catch(e) { console.error(e); }
    } else if (view === "history") {
        try { renderStarryMap(); } catch(e) { console.error(e); }
    }
}

    selectName.innerHTML = '<option value="">-- 全體柱與隊士 --</option>';
    Object.keys(monthlyData).forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        selectName.appendChild(opt);
    });

    const renderPlans = () => {
        const selectedName = selectName.value;
        const filterCust = selectCustomer.value;
        const filterItem = selectItem.value;

        container.innerHTML = "";
        let tasksToFilter = [];
        
        if (selectedName === "") {
            Object.entries(monthlyData).forEach(([name, tasks]) => {
                tasks.forEach(task => {
                    if (task.content.trim() !== "" || task.target.trim() !== "") {
                        tasksToFilter.push({ ...task, staffName: name });
                    }
                });
            });
        } else {
            const individualTasks = monthlyData[selectedName] || [];
            tasksToFilter = individualTasks.map(task => ({ ...task, staffName: selectedName }));
        }

        const filteredData = tasksToFilter.filter(plan => {
            const matchCust = (filterCust === "all" || plan.customerType === filterCust);
            const matchItem = (filterItem === "all" || plan.itemType === filterItem);
            return matchCust && matchItem;
        });

        if (filteredData.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#999; font-size:14px; margin-top:20px;">未接獲鎹鴉相關指令</p>';
            return;
        }

        filteredData.forEach((plan, index) => {
            const planEl = document.createElement("div");
            // 大正和風卡片
            planEl.style.cssText = "background: #fff; border: 2px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 18px; border-left: 8px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.15); position:relative;";
            
            // 標籤顏色：呼吸法配色
            const custColor = plan.customerType === '潛客' ? '#FFCDD2' : (plan.customerType === '新客' ? '#B3E5FC' : '#FFF9C4'); 
            const itemColor = plan.itemType === 'RS' ? '#C8E6C9' : (plan.itemType === '保健' ? '#FFE082' : '#E1BEE7');

            const custAbbr = plan.customerType ? plan.customerType.substring(0, 1) : '?';
            const itemAbbr = plan.itemType ? plan.itemType.substring(0, 1) : '?';
            const tagCircleStyle = "display:inline-flex; justify-content:center; align-items:center; width:28px; height:28px; border-radius:4px; color:var(--primary-dark); font-size:14px; font-weight:900; box-sizing:border-box; box-shadow: 1px 2px 4px rgba(0,0,0,0.2); border:1px solid rgba(0,0,0,0.1);";

            planEl.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px; border-bottom: 2px dashed #DDD; padding-bottom: 10px;">
                    <div>
                        <div style="font-weight: 900; color: var(--primary-dark); font-size: 19px; letter-spacing:1px;">${plan.staffName}</div>
                        <div style="font-size: 12px; color: #888; margin-top: 4px; font-weight:bold;">指派任務 肆之${index + 1}</div>
                    </div>
                    <div style="display:flex; gap: 8px; align-items:center;">
                        <span style="${tagCircleStyle} background:${custColor};" title="${plan.customerType || '未分類'}">${custAbbr}</span>
                        <span style="${tagCircleStyle} background:${itemColor};" title="${plan.itemType || '未分類'}">${itemAbbr}</span>
                    </div>
                </div>
                
                <div style="margin-bottom: 16px;">
                    <div style="font-weight: 900; color: var(--primary); font-size: 13px; margin-bottom: 6px; letter-spacing:1px;">斬鬼路線</div>
                    <div style="font-size: 15px; line-height: 1.6; color: #333; text-align: justify; font-weight:600;">${plan.content}</div>
                </div>

                <div>
                    <div style="font-weight: 900; color: var(--accent-red); font-size: 13px; margin-bottom: 6px; letter-spacing:1px;">討伐目標</div>
                    <div style="font-size: 15px; line-height: 1.6; color: #666; text-align: justify; font-weight:600;">${plan.target}</div>
                </div>
            `;
            container.appendChild(planEl);
        });
    };

    [selectName, selectCustomer, selectItem].forEach(el => el.addEventListener("change", renderPlans));
    renderPlans();
}

// ===== 進度條渲染 (水之呼吸與血鬼術配色) =====
async function fetchAndRenderProgress() {
    const container = $("progress-dashboard");
    if (!container) return;

    try {
        const response = await fetch(PROGRESS_API_URL);
        if (!response.ok) throw new Error("網路請求失敗");
        
        const tasks = await response.json(); 
        container.innerHTML = ""; 

        if (tasks.length === 0) {
            container.innerHTML = "<p style='text-align:center; color:#999;'>本月尚無討伐令</p>";
            return;
        }

        const groupedTasks = tasks.reduce((acc, task) => {
            if (!acc[task.staffName]) acc[task.staffName] = [];
            acc[task.staffName].push(task);
            return acc;
        }, {});

        Object.entries(groupedTasks).forEach(([staffName, staffTasks]) => {
            const taskRowsHtml = staffTasks.map(task => {
                // 水之呼吸藍 (高達成) 與 血鬼術紅 (低達成)
                const barColor = task.percent >= 80 ? "var(--secondary)" : "var(--accent-red)"; 
                return `
                    <div style="margin-bottom: 22px;">
                        <div style="display:flex; justify-content:space-between; align-items:end; margin-bottom:8px;">
                            <span style="font-size:15px; font-weight:bold; color:var(--primary-dark);">${task.taskName}</span>
                            <span style="font-weight:900; color:${barColor}; font-size:15px; background:#F5F5F5; padding:2px 8px; border-radius:4px; border: 1px solid #CCC;">${task.completed} / ${task.target}</span>
                        </div>
                        <div style="background:#E0E0E0; height:14px; border-radius:4px; overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,0.3);">
                            <div style="background:${barColor}; width:${task.percent}%; height:100%; transition:width 1.2s cubic-bezier(0.17, 0.67, 0.83, 0.67); border-radius:4px;"></div>
                        </div>
                        <div style="text-align:right; font-size:12px; color:#666; margin-top:6px; font-weight:bold;">呼吸法熟練度 ${task.percent}%</div>
                    </div>
                `;
            }).join("");

            const card = document.createElement("div");
            card.style.cssText = "background:#fff; padding:20px; border-radius:8px; margin-bottom:16px; border:2px solid var(--border); box-shadow: 0 6px 15px rgba(0,0,0,0.15);";
            
            card.innerHTML = `
                <div style="font-weight:900; font-size:19px; color:var(--primary-dark); margin-bottom:18px; border-bottom: 2px dashed #CCC; padding-bottom:10px; letter-spacing:2px;">
                     ${staffName} 
                </div>
                ${taskRowsHtml}
            `;
            container.appendChild(card);
        });

    } catch (error) {
        console.error("進度抓取失敗:", error);
        container.innerHTML = `<p style="text-align:center; color:var(--accent-red); font-size:14px; font-weight:bold;">⚠️ 無法接收鎹鴉回報</p>`;
    }
}

// ===== 歷史回顧與星圖 (鎹鴉) =====
async function renderStarryMap() {
    const container = $("starry-map-container");
    if (!container) return;
    
    container.innerHTML = "<p style='text-align:center; color:var(--primary-dark); font-size:14px; font-weight:bold;'>正在展開任務卷軸...</p>";

    try {
        const response = await fetch(`${PROGRESS_API_URL}?action=getHistory`);
        globalHistoryData = await response.json(); 

        container.innerHTML = ""; 
        const staffNames = Object.keys(monthlyData);

        staffNames.forEach(name => {
            const card = document.createElement("div");
            card.style.cssText = "background:#fff; padding:16px; border-radius:8px; margin-bottom:12px; border:2px solid var(--border); box-shadow: 0 4px 8px rgba(0,0,0,0.1);";
            
            let starsHtml = "";
            for (let i = 1; i <= 12; i++) {
                const monthKey = `${i}月`;
                const monthPlans = globalHistoryData[name]?.[monthKey]; 
                
                let displayContent = ""; 

                if (monthPlans && monthPlans.length > 0) {
                    const isAllDone = monthPlans.every(p => p.status === "⭐" || p.status === "⭐️");
                    
                    if (isAllDone) {
                        displayContent = `<div style="font-size:26px; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.4)); transform: scale(1.15);">🦅</div>`;
                    } else {
                        displayContent = `<div style="font-size:26px; filter:grayscale(1); opacity:0.25;">🦅</div>`;
                    }
                }

                starsHtml += `
                    <div onclick="openHistoryDetail('${name}', '${monthKey}')" style="text-align:center; cursor:pointer; min-height:45px; transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">
                        <div style="font-size:12px; color:#555; margin-bottom:4px; font-weight:900;">${i}月</div>
                        ${displayContent}
                    </div>
                `;
            }

            card.innerHTML = `
                <div style="font-weight:900; font-size: 16px; color:var(--primary-dark); margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; letter-spacing:1px;">
                    <span>${name}</span>
                </div>
                <div style="display:grid; grid-template-columns: repeat(6, 1fr); gap:10px;">
                    ${starsHtml}
                </div>
            `;
            container.appendChild(card);
        });
    } catch (error) {
        console.error("讀取星圖失敗:", error);
        container.innerHTML = "<p style='text-align:center; color:var(--accent-red); font-weight:bold;'>⚠️ 卷軸展開失敗，請檢查通訊</p>";
    }
}

// 詳細視窗與 RCA 邏輯
window.openHistoryDetail = function(name, month) {
    const modal = $("history-modal");
    const content = $("modal-content");
    const monthPlans = globalHistoryData[name]?.[month] || [];
    
    if (modal) modal.classList.remove("hidden");

    if (monthPlans.length === 0) {
        content.innerHTML = `<h3 style="text-align:center; color:#999; margin:20px 0;">該月無作戰任務 📜</h3>`;
        return;
    }

    let plansListHtml = monthPlans.map((p, idx) => {
        const isAchieved = p.status === '⭐' || p.status === '⭐️';
        const statusEmoji = isAchieved ? "🦅" : "🩸";
        const statusLabel = isAchieved ? "討伐成功" : "遭遇強敵";
        const themeColor = isAchieved ? "var(--secondary)" : "var(--accent-red)"; 
        const bgColor = isAchieved ? "#E1F5FE" : "#FFEBEE";    

        return `
            <div style="background:#fff; padding:16px; border-radius:6px; margin-bottom:14px; border-left:8px solid ${themeColor}; box-shadow: 0 2px 6px rgba(0,0,0,0.1); border-right: 1px solid #EEE; border-top: 1px solid #EEE; border-bottom: 1px solid #EEE;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <span style="font-size:13px; font-weight:900; color:#666;">路線 肆之${idx + 1}</span>
                    <span style="background:${bgColor}; color:${themeColor}; padding:4px 12px; border-radius:4px; font-size:13px; font-weight:900; border: 1px solid ${themeColor}66;">
                        ${statusEmoji} ${statusLabel}
                    </span>
                </div>
                <div style="font-size:15px; color:#222; line-height:1.6; font-weight:600;"><strong>指令：</strong>${p.plan}</div>
                <div style="font-size:13.5px; color:#555; margin-top:8px; padding-top:8px; border-top:1px dashed #CCC; font-weight:600;"><strong>目標：</strong>${p.target}</div>
            </div>
        `;
    }).join("");

    const hasFailedTask = monthPlans.some(p => !(p.status === "⭐" || p.status === "⭐️"));
    let rcaHtml = "";
    
    if (hasFailedTask) {
        rcaHtml = `
            <div style="border-top:3px double var(--border); margin-top:20px; padding-top:15px;">
                <h3 style="color:var(--accent-red); text-align:center; font-size:17px; margin-bottom:12px; font-weight:900; letter-spacing:1px;">🩸 討伐失敗原因分析</h3>
                <select id="rca-reason" style="width:100%; padding:14px; border-radius:6px; border:2px solid var(--border); font-size:15px; background:#F5F5F5; color:#222; font-weight:bold;">
                    <option value="外部突發">🩸 遭遇下弦之鬼突襲 (外部突發狀況)</option>
                    <option value="能力加強">💨 呼吸法訓練不足 (名單漏追/熟練度待加強)</option>
                    <option value="時間管理">🗡️ 日輪刀需要重鑄 (時間管理/工具問題)</option>
                    <option value="尋求支援">🦅 呼叫柱級隊員支援 (需要主管/同事協助)</option>
                    <option value="其他">📝 鎹鴉回報異常（面談討論）</option>
                </select>
                <button onclick="submitRCA('${name}', '${month}')" style="width:100%; background:var(--accent-red); color:white; padding:16px; border-radius:6px; margin-top:16px; border:none; font-weight:900; font-size:16px; cursor:pointer; box-shadow: 0 4px 0px #8B0000; transition:transform 0.1s; letter-spacing: 2px;">呼叫鎹鴉傳令</button>
            </div>
        `;
    }

    content.innerHTML = `
        <h3 style="color:var(--primary-dark); text-align:center; margin:0 0 20px 0; font-weight:900; font-size:22px; letter-spacing:2px;">${month} 討伐日誌 📜</h3>
        <div style="max-height:350px; overflow-y:auto; padding-right:5px;">${plansListHtml}</div>
        ${rcaHtml}
    `;
};

window.submitRCA = async function(name, month) {
    const reasonEl = document.getElementById("rca-reason");
    if (!reasonEl) return;
    
    const reason = reasonEl.value;
    const submitBtn = event.target; 

    submitBtn.disabled = true;
    submitBtn.innerText = "鎹鴉飛行中...";
    submitBtn.style.background = "#555";
    submitBtn.style.boxShadow = "none";

    try {
        await fetch(PROGRESS_API_URL, {
            method: "POST",
            mode: "no-cors", 
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "submitRCA", name: name, month: month, reason: reason })
        });

        alert(`✔️ 傳令成功！\n主公已收到「${month} / ${name}」的回報：\n${reason}`);
        closeModal(); 
        
    } catch (e) {
        console.error("RCA 送出失敗:", e);
        alert("❌ 鎹鴉迷失方向，請檢查網路連線");
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "呼叫鎹鴉傳令";
        submitBtn.style.background = "var(--accent-red)";
        submitBtn.style.boxShadow = "0 4px 0px #8B0000";
    }
};

window.closeModal = function() {
    if ($("history-modal")) $("history-modal").classList.add("hidden");
};

document.addEventListener("DOMContentLoaded", () => {
    if($("tab-huddle")) $("tab-huddle").addEventListener("click", () => showView("huddle"));
    if($("tab-plan")) $("tab-plan").addEventListener("click", () => showView("plan"));
    if($("tab-history")) $("tab-history").addEventListener("click", () => showView("history"));
  
    showView("huddle");
    initPlanTab();
});
</script>
